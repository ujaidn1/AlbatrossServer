name: hujakamuja
on:
  push:
    paths:
      - AndroidManifest.xml
  schedule:
    - cron: '26 */1 * * *'  # every 2 hours at minute 4

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: chsy
        run: python albatross-python/albatross/plugin.py

